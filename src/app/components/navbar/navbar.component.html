<nav class="fixed top-0 inset-x-0 z-50 transition-all duration-500" [class.nav-solid]="isScrolled()">
  <!-- Reading progress -->
  <div class="scroll-progress" [style.width.%]="scrollProgress()" aria-hidden="true"></div>
  <div class="section-wrap">
    <div class="flex items-center justify-between h-16 md:h-[72px]">

      <!-- Logo -->
      <a href="#home" class="logo flex items-center gap-2 font-display font-bold text-xl" (click)="closeMobile()">
        <span class="logo-mark w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold text-white">YB</span>
        <span class="hidden sm:block text-white/90 hover:text-white transition-colors">Yashwanth</span>
      </a>

      <!-- Desktop nav -->
      <div class="hidden lg:flex items-center gap-1">
        @for (item of navItems; track item.href) {
          <a
            [href]="item.href"
            class="nav-link relative px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all duration-200"
            [class.active]="activeSection() === item.href.replace('#', '')"
          >
            {{ item.label }}
          </a>
        }
      </div>

      <!-- Theme switcher + CTA + hamburger -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button
          type="button"
          class="theme-switch"
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.theme() === 'underground' ? 'Switch to Ocean theme' : 'Switch to Underground theme'"
          [title]="themeService.theme() === 'underground' ? 'Switch to Ocean theme' : 'Switch to Underground theme'"
        >
          <span class="theme-switch-icon">{{ themeService.theme() === 'underground' ? '🌊' : '🌌' }}</span>
          <span class="theme-switch-label hidden sm:inline">{{ themeService.theme() === 'underground' ? 'Ocean' : 'Underground' }}</span>
        </button>
        <a href="#contact" class="hidden lg:inline-flex btn btn-primary !py-2 !px-5 !text-sm">
          Hire Me
        </a>
        <button
          class="lg:hidden w-9 h-9 flex items-center justify-center rounded-lg text-gray-300 hover:bg-white/10 transition-colors"
          (click)="toggleMobile()"
          aria-label="Toggle menu"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @if (isMobileOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile drawer -->
  @if (isMobileOpen()) {
    <div class="lg:hidden mobile-drawer border-t border-white/8">
      <div class="section-wrap py-4 space-y-1">
        @for (item of navItems; track item.href) {
          <a
            [href]="item.href"
            class="block px-4 py-3 rounded-xl text-gray-300 hover:bg-white/8 hover:text-white font-medium transition-all duration-200"
            (click)="closeMobile()"
          >
            {{ item.label }}
          </a>
        }
        <div class="pt-3 border-t border-white/8 mt-2">
          <a href="#contact" class="btn btn-primary w-full justify-center py-3" (click)="closeMobile()">
            Hire Me
          </a>
        </div>
      </div>
    </div>
  }
</nav>
